name: Sync Music Page

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC
  workflow_dispatch:  # Allow manual trigger from the Actions tab

permissions:
  contents: write  # Needed to commit and push to source

jobs:
  sync-music:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source

      - name: Run music sync script
        run: python3 manage/sync_music.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- site/pages/music.md; then
            echo "No changes to site/pages/music.md"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/pages/music.md
          git commit -m "content: sync music page with latest playlist videos"
          git push origin source
